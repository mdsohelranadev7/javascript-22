<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="src/output.css">
    <link rel="stylesheet" href="src/all.min.css">






</head>

<body>
    <div id="bgColor" class=" h-56 bg-[#11bcbc] relative border m-5">


        <h2 id="headtext" class="text-center pt-15 text-2xl"> Click the color button </h2>

        <button id="colorBtn"
            class="border p-2 block mx-auto mt-3 bg-blue-500 text-white rounded-3xl cursor-pointer ">Color
            Button</button>

        <div class=" absolute top-10 right-50">
            <span class="cursor-pointer" id="moon"><i class="fa-solid fa-moon text-2xl text-red-500 "></i></span>
            <span class="cursor-pointer" id="sun"><i class="fa-solid fa-sun text-2xl text-red-500 ml-3 "></i></span>

        </div>

    </div>



    <div id="secoundDiv" class="  bg-red-400 h-56 m-5">

        <h2 class="text-center pt-15 text-2xl"> choice your generate color code</h2>

        <div class="flex justify-center items-center">
            <input type="text" id="output" placeholder="#000000" class="border rounded-2xl pl-3 m-5">



            <button class="border h-7 w-20 rounded-2xl text-center flex justify-center items-center cursor-pointer"
                id="copyBtn" onclick="sdkl()" >copy</button>
        </div>

        <div id="toast"
            class="hidden absolute top-70 right-20 bg-green-500">
            ✅ Copied!
        </div>

        <button id="hexa" class="border p-2 block mx-auto mt-3 bg-blue-500 text-white rounded-3xl cursor-pointer ">Color
            button</button>





     



<button class="cursor-pointer" id="cp" onclick="sdkl()">copy</button>


    <script src="js/script.js"></script>
</body>

</html>
